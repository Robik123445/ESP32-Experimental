name: Build ESP32-S3

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare CNC WebUI image
        run: |
          # mkspiffs used by ESP-IDF 4.4 has a short object-name limit.
          # Printer3D assets are unrelated to this CNC firmware build and contain
          # paths such as Printer3D/Marlin-embedded/index.html.gz that exceed it.
          rm -rf webui/Printer3D

      - name: Build ESP32-S3 firmware
        uses: docker://espressif/idf:v4.4.6
        with:
          entrypoint: /opt/esp/entrypoint.sh
          args: bash -c "idf.py set-target esp32s3 && idf.py build"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: grbl-esp32s3
          path: build/grbl.bin
